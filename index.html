<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Dashboard</title>
  <meta name="description" content="Organize research papers, notes, citations, deadlines and project progress. All data stays in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M9 22V10M9 22h14M13 18v-4M17 18v-7M21 18v-5' stroke='white' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply theme before first paint to avoid a flash.
    try {
      const s = JSON.parse(localStorage.getItem('research-dashboard.v1') || '{}').settings || {};
      const t = s.theme && s.theme !== 'system' ? s.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
      if (s.accent) document.documentElement.style.setProperty('--accent', s.accent);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Research<br><small>Dashboard</small></span>
      </a>
      <nav id="nav" aria-label="Main"></nav>
      <p class="sidebar-foot">Data is stored only in this browser.</p>
    </aside>
    <header class="topbar">
      <button class="btn ghost" id="menuBtn" aria-label="Open menu" aria-controls="sidebar"></button>
      <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span><span>Research Dashboard</span></a>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
  <noscript><p style="padding:2rem">This dashboard needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
